# Faater — Cloudflare Worker (zero-AI answer path)
#
# Create the D1 database once, then put its id here and load the seed:
#   npx wrangler d1 create faater
#   npx wrangler d1 execute faater --remote --file=data/build/d1/schema.sql
#   npx wrangler d1 execute faater --remote --file=data/build/d1/seed.sql
#   npx wrangler deploy
#
# No Workers AI binding: the answer path has no model call. Adding one here
# would put a free quota on the critical path, which the architecture forbids.

name = "faater"
main = "worker/src/index.ts"
compatibility_date = "2026-10-30"

[vars]
ALLOWED_ORIGIN = "*"

[[d1_databases]]
binding = "DB"
database_name = "faater"
database_id = "50163789-cd91-4f7b-bb9a-6eac3430a8a7"

# Turnstile: set the secret as a Worker secret, never in this file.
#   npx wrangler secret put TURNSTILE_SECRET

# Static frontend served by the same Worker. The API routes run first; every
# other path is an asset.
[assets]
directory = "./web"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"
